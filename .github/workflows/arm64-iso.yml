name: ARM64 ISO

# Builds the generic aarch64 ISO on a native ARM runner: Arch Linux ARM's
# kernel, the published edge packages, nothing board-specific. This is the
# image a VM can boot, so it is the one CI can go on to install and test.
#
# The push trigger exists while this lives on a branch: a manual run needs the
# workflow on the default branch first.
on:
  push:
    branches: [arm64-generic]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # As quattro's unit-test.yml runs them: on x86, in an Arch container. The
  # installer tests stage a Node tarball named for x64 and the code looks for
  # the host's architecture, so they fail on an aarch64 host. The container
  # boots systemd because the keyboard tests ask the real localectl for its
  # keymaps, and the tests run as an ordinary user because some of them check
  # what happens when a file cannot be written.
  #
  # A privileged container shares the host's consoles and devices, so the
  # units that would claim them are masked before systemd starts.
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Run ./test/all in an Arch container
        run: |
          docker run -d --name unit --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /tmp:exec \
            -v "$PWD:/src:ro" archlinux:latest bash -c '
              systemctl mask getty.target console-getty.service \
                systemd-udev-trigger.service systemd-udevd.service \
                systemd-vconsole-setup.service
              exec /usr/lib/systemd/systemd
            '
          docker exec unit bash -euo pipefail -c '
            for i in $(seq 1 60); do
              state=$(systemctl is-system-running 2>/dev/null || true)
              case $state in running | degraded) break ;; esac
              sleep 1
            done
            echo "systemd: $state"
            pacman -Syu --noconfirm --needed python parted openssh patch git diffutils >/dev/null
            useradd -m tester
            cp -r /src /home/tester/omarchy-iso
            chown -R tester /home/tester/omarchy-iso
            cd /home/tester/omarchy-iso
            setpriv --reuid=tester --regid=tester --init-groups ./test/all
          '

  build:
    name: Build the generic ISO
    runs-on: namespace-profile-linux-arm64-16x32
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Runner
        run: |
          uname -srm
          echo "$(nproc) CPUs, $(free -h | awk 'NR==2 {print $2}') memory, $(df -h --output=avail . | tail -1 | tr -d ' ') free disk"
          echo "LSMs: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unreadable)"
          echo "KVM: $([[ -e /dev/kvm ]] && echo present || echo absent)"
          docker version --format 'docker {{.Server.Version}}' || sudo docker version --format 'docker {{.Server.Version}}'

      # The packages the offline mirror is built from: 3.3 GB that otherwise
      # come down again on every run. The build prunes what it no longer needs.
      # Skipped, not failed, on a runner profile without a cache volume.
      - name: Package cache (Namespace)
        continue-on-error: true
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          path: ~/.cache/omarchy

      - name: Build the ISO
        run: |
          start=$(date +%s)
          ./bin/omarchy-iso-make --arch aarch64 --platform generic --edge --no-boot-offer
          echo "Built in $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Inspect the ISO
        run: |
          set -euo pipefail
          command -v bsdtar >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools >/dev/null; }
          iso=$(ls release/*.iso)
          (cd release && sha256sum "$(basename "$iso")" | tee "$(basename "$iso").sha256")
          bsdtar -tvf "$iso" >listing.txt
          # What the firmware starts, what GRUB loads and what the installer installs from.
          for want in EFI/BOOT/BOOTAA64.EFI arch/boot/aarch64/vmlinuz-linux-aarch64 \
            arch/boot/aarch64/initramfs-linux-aarch64.img arch/aarch64/airootfs.sfs; do
            grep -Eiq " $want\$" listing.txt || { echo "::error::$iso has no $want"; exit 1; }
          done
          {
            echo "\`$(basename "$iso")\`, $(( $(stat -c %s "$iso") / 1048576 )) MiB"
            echo
            echo '```'
            grep -E ' (arch/boot/aarch64|EFI/BOOT|arch/aarch64)/[^/]+$' listing.txt | awk '{print $5, $NF}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omarchy-arm64-generic-${{ github.run_number }}
          path: |
            release/*.iso
            release/*.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
