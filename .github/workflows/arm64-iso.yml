name: ARM64 ISO

# Builds the generic aarch64 ISO on a native ARM runner: Arch Linux ARM's
# kernel, the published edge packages, nothing board-specific. This is the
# image a VM can boot, so it is the one CI can go on to install and test.
#
# The push trigger exists while this lives on a branch: a manual run needs the
# workflow on the default branch first.
on:
  push:
    branches: [arm64-generic]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # As quattro's unit-test.yml runs them: on x86, in an Arch container. The
  # installer tests stage a Node tarball named for x64 and the code looks for
  # the host's architecture, so they fail on an aarch64 host. The container
  # boots systemd because the keyboard tests ask the real localectl for its
  # keymaps, and the tests run as an ordinary user because some of them check
  # what happens when a file cannot be written.
  #
  # A privileged container shares the host's consoles and devices, so the
  # units that would claim them are masked before systemd starts.
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Run ./test/all in an Arch container
        run: |
          docker run -d --name unit --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /tmp:exec \
            -v "$PWD:/src:ro" archlinux:latest bash -c '
              systemctl mask getty.target console-getty.service \
                systemd-udev-trigger.service systemd-udevd.service \
                systemd-vconsole-setup.service
              exec /usr/lib/systemd/systemd
            '
          docker exec unit bash -euo pipefail -c '
            for i in $(seq 1 60); do
              state=$(systemctl is-system-running 2>/dev/null || true)
              case $state in running | degraded) break ;; esac
              sleep 1
            done
            echo "systemd: $state"
            pacman -Syu --noconfirm --needed python parted openssh patch git diffutils >/dev/null
            useradd -m tester
            cp -r /src /home/tester/omarchy-iso
            chown -R tester /home/tester/omarchy-iso
            cd /home/tester/omarchy-iso
            setpriv --reuid=tester --regid=tester --init-groups ./test/all
          '

  build:
    name: Build the generic ISO
    runs-on: namespace-profile-linux-arm64-16x32
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Runner
        run: |
          uname -srm
          echo "$(nproc) CPUs, $(free -h | awk 'NR==2 {print $2}') memory, $(df -h --output=avail . | tail -1 | tr -d ' ') free disk"
          echo "LSMs: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unreadable)"
          echo "KVM: $([[ -e /dev/kvm ]] && echo present || echo absent)"
          docker version --format 'docker {{.Server.Version}}' || sudo docker version --format 'docker {{.Server.Version}}'

      # The packages the offline mirror is built from: 3.3 GB that otherwise
      # come down again on every run. The build prunes what it no longer needs.
      # Skipped, not failed, on a runner profile without a cache volume.
      - name: Package cache (Namespace)
        continue-on-error: true
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          path: ~/.cache/omarchy

      # The Omarchy packages are built from source, as the N1x image builds
      # them: the published ones carry no aarch64 pacman configuration, and
      # until omarchy#14637 reaches edge their installer looks for an x64 Node
      # tarball on every architecture. omarchy's arm64-generic branch is n1x
      # plus one line, the installed system's mirrorlist pointed at Omarchy's
      # own mirror; it goes back to n1x when that line lands there.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: omacom/omarchy
          ref: arm64-generic
          path: src/omarchy
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: omacom/omarchy-pkgs
          ref: n1x
          path: src/omarchy-pkgs
          persist-credentials: false

      - name: Build the ISO
        run: |
          start=$(date +%s)
          ./bin/omarchy-iso-make --arch aarch64 --platform generic --no-boot-offer \
            --local-source src/omarchy src/omarchy-pkgs
          echo "Built in $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Inspect the ISO
        run: |
          set -euo pipefail
          command -v bsdtar >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools >/dev/null; }
          iso=$(ls release/*.iso)
          (cd release && sha256sum "$(basename "$iso")" | tee "$(basename "$iso").sha256")
          bsdtar -tvf "$iso" >listing.txt
          # What the firmware starts, what GRUB loads and what the installer installs from.
          for want in EFI/BOOT/BOOTAA64.EFI arch/boot/aarch64/vmlinuz-linux-aarch64 \
            arch/boot/aarch64/initramfs-linux-aarch64.img arch/aarch64/airootfs.sfs; do
            grep -Eiq " $want\$" listing.txt || { echo "::error::$iso has no $want"; exit 1; }
          done
          {
            echo "\`$(basename "$iso")\`, $(( $(stat -c %s "$iso") / 1048576 )) MiB"
            echo
            echo '```'
            grep -E ' (arch/boot/aarch64|EFI/BOOT|arch/aarch64)/[^/]+$' listing.txt | awk '{print $5, $NF}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # For the boot job: Namespace's own artifact store is in the same place
      # as its runners. GitHub's took 3 min 20 s to hand the ISO back.
      - name: Keep the ISO in Namespace's artifact store
        id: nsc
        continue-on-error: true
        run: |
          command -v nsc >/dev/null || { curl -fsSL https://get.namespace.so/cloud/install.sh | sh; export PATH="$HOME/.local/bin:$PATH"; }
          cd release
          iso=$(ls ./*.iso); iso=${iso#./}
          printf '%s\n' "$iso" >NAME
          for f in NAME "$iso" "$iso.sha256"; do
            nsc artifact upload "$f" "arm64-iso/${{ github.run_id }}/$f" --expires_in 48h
          done
          rm NAME

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omarchy-arm64-generic-${{ github.run_number }}
          path: |
            release/*.iso
            release/*.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  # The image through its own boot path: firmware, GRUB, the live kernel and
  # initramfs, the live root. Apple-backed runners are the ARM ones with KVM.
  boot:
    name: Boot the live ISO under KVM
    needs: build
    runs-on: namespace-profile-arm64-linux-apple-12x32
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Runner
        run: |
          uname -srm
          echo "$(nproc) CPUs, $(free -h | awk 'NR==2 {print $2}') memory, $(df -h --output=avail . | tail -1 | tr -d ' ') free disk"
          grep -m2 -E 'CPU implementer|CPU part' /proc/cpuinfo || true
          ls -l /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]] || sudo chmod 666 /dev/kvm

      - name: QEMU and firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-efi-aarch64 >/dev/null
          qemu-system-aarch64 --version | head -1

      - name: ISO from Namespace's artifact store
        id: fast
        continue-on-error: true
        run: |
          command -v nsc >/dev/null || { curl -fsSL https://get.namespace.so/cloud/install.sh | sh; export PATH="$HOME/.local/bin:$PATH"; }
          mkdir -p iso && cd iso
          nsc artifact download "arm64-iso/${{ github.run_id }}/NAME" NAME
          iso=$(cat NAME)
          time nsc artifact download "arm64-iso/${{ github.run_id }}/$iso" "$iso"
          nsc artifact download "arm64-iso/${{ github.run_id }}/$iso.sha256" "$iso.sha256"
          rm NAME

      - name: ISO from GitHub's artifact store (fallback, slow)
        if: steps.fast.outcome != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: omarchy-arm64-generic-${{ github.run_number }}
          path: iso

      - name: Boot it
        run: |
          (cd iso && sha256sum -c ./*.sha256)
          ./test/arm64-live-boot iso/*.iso evidence
          echo "The live system offered a login after $(cut -d= -f2 evidence/timing) s." >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: arm64-live-boot-${{ github.run_number }}
          path: evidence
          retention-days: 7
          if-no-files-found: warn

  # The whole path with nobody at the keyboard: the installer answers from a
  # cidata drive, writes the disk, and the machine restarts into what it wrote.
  install:
    name: Install it unattended and boot the result
    needs: build
    runs-on: namespace-profile-arm64-linux-apple-12x32
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Runner
        run: |
          uname -srm
          echo "$(nproc) CPUs, $(free -h | awk 'NR==2 {print $2}') memory, $(df -h --output=avail . | tail -1 | tr -d ' ') free disk"
          grep -m2 -E 'CPU implementer|CPU part' /proc/cpuinfo || true
          ls -l /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]] || sudo chmod 666 /dev/kvm

      - name: QEMU and firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-efi-aarch64 qemu-utils \
            mtools dosfstools jq openssl openssh-client tesseract-ocr >/dev/null
          qemu-system-aarch64 --version | head -1

      - name: ISO from Namespace's artifact store
        id: fast
        continue-on-error: true
        run: |
          command -v nsc >/dev/null || { curl -fsSL https://get.namespace.so/cloud/install.sh | sh; export PATH="$HOME/.local/bin:$PATH"; }
          mkdir -p iso && cd iso
          nsc artifact download "arm64-iso/${{ github.run_id }}/NAME" NAME
          iso=$(cat NAME)
          time nsc artifact download "arm64-iso/${{ github.run_id }}/$iso" "$iso"
          nsc artifact download "arm64-iso/${{ github.run_id }}/$iso.sha256" "$iso.sha256"
          rm NAME

      - name: ISO from GitHub's artifact store (fallback, slow)
        if: steps.fast.outcome != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: omarchy-arm64-generic-${{ github.run_number }}
          path: iso

      - name: Install, reboot, check
        run: |
          (cd iso && sha256sum -c ./*.sha256)
          ./test/arm64-install iso/*.iso evidence
          {
            echo "Installed, rebooted and checked in $(cut -d= -f2 evidence/timing) s."
            echo
            echo '```'
            cat evidence/checks
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: arm64-install-${{ github.run_number }}
          path: evidence
          retention-days: 7
          if-no-files-found: warn
