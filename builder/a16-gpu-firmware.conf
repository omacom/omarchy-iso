# MSM requests these dynamically and does not declare them through modinfo.
# The A16 live image loads KMS before mounting its firmware-bearing live root.
for a16_firmware in qcom/gen80100_sqe.fw qcom/gen80100_gmu.bin; do
  a16_found=0
  for a16_suffix in '' .zst .xz; do
    for a16_directory in /usr/lib/firmware/updates /usr/lib/firmware; do
      if [[ -s $a16_directory/$a16_firmware$a16_suffix ]]; then
        FILES+=("$a16_directory/$a16_firmware$a16_suffix")
        a16_found=1
        break 2
      fi
    done
  done
  if (( ! a16_found )); then
    echo "Missing A16 live GPU firmware: $a16_firmware" >&2
    return 1
  fi
done
unset a16_firmware a16_found a16_suffix a16_directory
