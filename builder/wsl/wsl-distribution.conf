# Omarchy WSL distribution metadata.
# See https://learn.microsoft.com/en-us/windows/wsl/build-custom-distro
# Shipped as /etc/wsl-distribution.conf inside the .wsl tarball (root:root 0644).
#
# No oobe.command: the image ships the provisioned `omarchy` user (uid 1000),
# the same account the ISO installs, so first launch signs straight in.
# oobe.defaultName is what makes a double-clicked .wsl install.

[oobe]
defaultName=Omarchy

[shortcut]
enabled=true

[windowsterminal]
enabled=true
ProfileTemplate=/usr/lib/wsl/terminal-profile.json
