# Omarchy WSL per-distribution settings.
# See https://learn.microsoft.com/en-us/windows/wsl/wsl-config
# Shipped as /etc/wsl.conf inside the .wsl tarball (root:root 0644).

[boot]
systemd=true

[user]
default=omarchy

[network]
generateHosts=true
generateResolvConf=true

[interop]
enabled=true
appendWindowsPath=true
