#
# /etc/pacman.conf (aarch64, rc channel)
#
# Arch proper is x86_64-only -- there is no core/os/aarch64 -- so the ARM base
# comes from Arch Linux ARM. ALARM also lays its tree out differently: the path
# is $arch/$repo, not Arch's $repo/os/$arch, and there is no /os/ component. The
# Server lines below therefore cannot be produced by re-pointing the x86_64
# config at another host.
#
# ALARM carries a third base repo, [alarm], alongside core and extra. There is no
# [multilib] (32-bit x86) and no [arch-mact2] (Apple T2 Macs, x86-only).
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Keep the Omarchy compatibility overlay first so tested ARM overrides win
# during an incomplete ALARM ABI transition.
[omarchy]
SigLevel = Optional TrustAll
Server = https://pkgs.omarchy.org/rc/$arch

[core]
Server = https://cdnmirror.com/archlinuxarm/$arch/$repo
Server = https://mirrors.dotsrc.org/archlinuxarm/$arch/$repo
Server = https://de3.mirror.archlinuxarm.org/$arch/$repo
Server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = https://cdnmirror.com/archlinuxarm/$arch/$repo
Server = https://mirrors.dotsrc.org/archlinuxarm/$arch/$repo
Server = https://de3.mirror.archlinuxarm.org/$arch/$repo
Server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = https://cdnmirror.com/archlinuxarm/$arch/$repo
Server = https://mirrors.dotsrc.org/archlinuxarm/$arch/$repo
Server = https://de3.mirror.archlinuxarm.org/$arch/$repo
Server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
Server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
