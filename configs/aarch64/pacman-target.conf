# See the pacman.conf(5) manpage for option and repository directives

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# The Omarchy ARM repository is an overlay, not just an add-on repository.  It
# must precede ALARM so a tested compatibility package can quarantine a broken
# upstream transition without requiring a full downstream mirror.
[omarchy]
SigLevel = Optional TrustAll
Server = @@OMARCHY_PKGS_MIRROR@@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist
