# Restore live archiso hooks after omarchy-settings applies installed-system hooks.
# aarch64 does not support the microcode hook.
HOOKS=(base udev plymouth modconf kms memdisk archiso archiso_loop_mnt
       archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs
       block filesystems keyboard)

# linux-aarch64 does not provide the thunderbolt module.
_keep=()
for _m in "${MODULES[@]:-}"; do
  [[ $_m == "thunderbolt" || -z $_m ]] || _keep+=("$_m")
done
MODULES=("${_keep[@]}")
unset _keep _m
