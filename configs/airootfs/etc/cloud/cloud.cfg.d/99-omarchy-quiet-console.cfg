# The installer owns the console. cloud-init's final stage prints every SSH
# host key's fingerprint and randomart (about 50 lines) whenever it gets there.
# On a slow medium that is after the installer has stopped with "install
# medium is too slow: try another USB stick or port", and the advice scrolls
# off the screen. The journal still has all of it.
ssh:
  emit_keys_to_console: false
no_ssh_fingerprints: true
