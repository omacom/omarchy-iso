<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Live installer under kmscon: Latin from Adwaita Mono, CJK from the bundled
     Noto Sans Mono CJK SC (two cells per glyph). -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Adwaita Mono</family>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
