# mkinitcpio config for the STOCK linux initramfs on the Omarchy live medium.
#
# Same archiso profile as /etc/mkinitcpio.conf.d/archiso.conf (used for the
# linux-t2 preset) plus the nvidia modules baked in, so an NVIDIA GPU gets DRM
# modesetting from the very first frame on the stock-linux try-desktop boot.
#
# These modules are NOT added to the shared archiso.conf used by the linux-t2
# preset: there is no nvidia module for linux-t2, so including them there would
# make the T2 initramfs build fail (mkinitcpio aborts on a missing module).
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs plymouth block filesystems keyboard)
MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
