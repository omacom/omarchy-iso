# Configuration for the live initramfs.
#
# No `kms`. This initramfs is generic: archiso has no autodetect, on purpose,
# because one image must boot any machine. With the kms hook that means
# mkinitcpio adds every DRM driver and every DRM driver's firmware:
# initramfs-linux-t2.img is then 257 MB, 153 MB of it usr/lib/firmware, and
# 105 MB of that is the four nouveau GSP blobs the pre-built UKI also
# carries.
#
# This initramfs only has to find and mount airootfs.sfs. Every GPU driver
# loads normally from the live root once it is mounted. simpledrm, drm and
# drm_kms_helper are in the kernel's modules.builtin, so a UEFI machine has a
# framebuffer console on the EFI framebuffer with nothing in the initramfs,
# and a BIOS boot has vgacon until its driver loads. The installer greeter is
# a TUI either way.
#
# No `plymouth` on x86_64 either. Without early KMS it drew its splash only
# on UEFI, for the second or two before the greeter, and on a BIOS machine it
# blanked the console it could not draw on; its hook also put 2.4 MB in the
# initramfs and two units on the chain before getty. omarchy-logo prints the
# logo on tty1 instead, on both firmware paths, as the first thing the
# initramfs does. The aarch64 build puts plymouth back
# (builder/archiso-aarch64-mkinitcpio.sh).
#
# omarchy-i915 is the one exception to "no GPU driver here": on the Intel
# generations before Skylake, which need no firmware, it loads i915 right
# after udevd is up, so the panel comes up while the medium is still being
# read instead of after the login. It runs before udev's hook so the modeset
# overlaps the wait for the install medium.
#
# Two images come out of this configuration (builder/linux-omarchy.preset):
# the ISO's own entries boot one built without the four archiso_pxe hooks,
# whose network drivers, firmware, curl and TLS stack are 28 MB a USB boot
# never runs; the PXE entries boot the one with them.
#
# GRUB reads this whole file off the install medium before the kernel starts,
# so the bytes are boot latency as well as ISO size: 257 MB is 0.6 s on a
# 430 MB/s stick and 6.6 s on a USB 2 port at 39 MB/s.
#
# loop is loaded up front: the archiso hook loop-mounts airootfs.sfs, and
# losetup can only autoload the module through the /dev/loop-control node
# the udev hook creates from kmod's static-node list. Booted from a Ventoy
# stick that node is not there, and losetup fails with ENOENT into a shell
# behind the splash.
# The block and filesystems hooks below are this repository's own, in
# etc/initcpio/install/, under mkinitcpio's names: the same modules for the
# devices an install medium can be on, without the server storage controllers,
# network and cluster filesystems and mount helpers (about 15 MB).
#
# zstd at level 19 rather than its default 3 for the compressed part: the
# kernel decompresses both as fast, and the firmware reads 3 MB less. The
# window stays zstd's 8 MB at this level, which the kernel's decompressor
# allocates at boot.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
MODULES=(loop)
HOOKS=(base omarchy-logo omarchy-i915 udev microcode modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
