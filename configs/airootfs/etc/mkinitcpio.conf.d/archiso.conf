# Configuration for archiso with Plymouth
#
# No `kms`. This initramfs is generic: archiso has no autodetect, on purpose,
# because one image must boot any machine. With the kms hook that means
# mkinitcpio adds every DRM driver and every DRM driver's firmware:
# initramfs-linux-t2.img is then 257 MB, 153 MB of it usr/lib/firmware, and
# 105 MB of that is the four nouveau GSP blobs the pre-built UKI also
# carries.
#
# This initramfs only has to find and mount airootfs.sfs. Every GPU driver
# loads normally from the live root once it is mounted, so kms is not what
# makes graphics work here; it only moves the modules earlier so Plymouth can
# splash before the switch. simpledrm, drm and drm_kms_helper are in the
# kernel's modules.builtin, so a UEFI machine still has a DRM device on the EFI
# framebuffer with nothing in the initramfs, and a BIOS boot still has vgacon.
# The installer greeter is a TUI either way.
#
# GRUB reads this whole file off the install medium before the kernel starts,
# so the bytes are boot latency as well as ISO size: 257 MB is 0.6 s on a
# 430 MB/s stick and 6.6 s on a USB 2 port at 39 MB/s.
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs plymouth block filesystems keyboard)
