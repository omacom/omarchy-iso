# The live installer does not ship bluez or use Bluetooth, and its finish screen
# reboots immediately (systemctl reboot -ff) once the target is released so the
# install medium can be removed. Leaving btusb loaded lets it download firmware
# into MediaTek MT7925/RZ717 adapters that then wedge across that forced warm
# reboot (USB descriptor read error -110, address error -62) until a full EC
# power drain. The installed system loads btusb normally.
blacklist btusb
