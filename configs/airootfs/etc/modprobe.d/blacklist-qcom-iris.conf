# The live installer does not play or decode hardware video, and
# customize_airootfs.sh strips Qualcomm VPU firmware (qcvss*.mbn). Letting
# qcom_iris probe on the live ISO logs repeated firmware-load failures (-2) in
# dmesg. Try Omarchy soft-reboots into omarchy-root without this live-only
# blacklist, where udev loads qcom_iris normally.
blacklist qcom_iris
