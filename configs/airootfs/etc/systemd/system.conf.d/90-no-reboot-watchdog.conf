# Disable systemd's hardware reboot watchdog in the live environment.
# On Qualcomm Snapdragon laptops (qcom-wdt), arming watchdog0 during reboot
# triggers repeated "watchdog: watchdog0: watchdog did not stop!" kernel
# messages, matching install/hardware/qualcomm/reboot-watchdog.sh in omarchy.
[Manager]
RebootWatchdogSec=0
