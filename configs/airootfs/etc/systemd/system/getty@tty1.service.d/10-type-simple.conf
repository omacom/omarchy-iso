# getty@.service is Type=idle: the service program is not started until every
# active job has been dispatched, capped at 5 s (systemd.service(5)). That is
# meant to keep a getty's prompt from interleaving with boot status output on a
# noisy console. On the live ISO nothing prints on the console, and the boot
# transaction never drains: systemd-time-wait-sync.service waits for a clock
# sync that an offline installer never gets, with other start jobs queued
# behind it, so the autologin on tty1 waits out the full 5 s on every boot.
#
# Measured over two boots each: the greeter is up at 15.0 and 14.9 s with
# Type=idle, at 9.1 and 9.6 s with Type=simple. The journal shows the gap:
# "Started Getty on tty1" at 6.9 s, the root session opened at 12.1 s,
# nothing logged in between.
[Service]
Type=simple
