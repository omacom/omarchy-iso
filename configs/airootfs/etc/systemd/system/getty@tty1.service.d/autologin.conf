# Replaces archiso's releng autologin.conf, which drew an Arch login screen
# ("Arch Linux ... (tty1)", "archiso login: root (automatic login)") before
# the installer: --skip-login logs root in without printing a prompt,
# --noissue and --nonewline print nothing in its place, and without
# --noclear agetty clears the boot messages off the screen first.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --skip-login --noissue --nonewline --autologin root - $TERM
