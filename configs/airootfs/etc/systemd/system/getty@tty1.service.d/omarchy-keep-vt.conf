# getty@.service disallocates its VT before agetty starts, which wipes the
# screen. The live initramfs prints the Omarchy logo there
# (etc/initcpio/hooks/omarchy-logo) and it should stay until the greeter draws
# over it; agetty itself already runs with --noclear (autologin.conf).
#
# It also hangs the VT up (vhangup) before and after agetty, which cuts off
# every other open descriptor of it: a layout of the boot logo in progress
# then loses its writes and its font load (omarchy-console-logo-redraw, when
# a GPU driver takes the console over as getty starts; QEMU's screen dumps
# showed the console blank, or the logo in a font without its glyphs, until
# the greeter). Nothing else holds tty1 on the live system.
#
# Nor does it reset the VT: the reset puts it back in text mode, and a GPU
# driver loading as getty starts on a UEFI machine finds the console its
# redraw froze (omarchy-console-logo-redraw --before-driver) drawing again,
# fbcon showing the logo's text cut and scrolled on its framebuffer. agetty
# sets the terminal up itself.
[Service]
TTYVTDisallocate=no
TTYVHangup=no
TTYReset=no
