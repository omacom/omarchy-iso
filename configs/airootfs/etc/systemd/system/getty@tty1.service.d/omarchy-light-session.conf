# Root's autologin on tty1 runs the installer, which needs no service manager
# of its own: systemd --user would bring the session D-Bus, gpg-agent and
# p11-kit sockets, and nothing in the live session uses them. pam_systemd
# starts one for a regular session and login waits for it before the shell
# starts: 0.2 s on the way to the greeter (QEMU). The light class (systemd
# 258 on) skips it; /run/user/0 is still made. An SSH login gets the regular
# class and its manager.
[Service]
Environment=XDG_SESSION_CLASS=user-early-light
