# getty@.service is Type=idle: systemd holds it until every queued boot job is
# dispatched, for up to 5 s. On the live ISO those jobs include
# systemd-time-wait-sync, which waits for NTP and never finishes offline or
# when the network's NTP server doesn't answer, so the installer on tty1 waits
# the full 5 s on most boots.
#
# Type=idle also kept PID 1 off the console once it stopped waiting. The live
# ISO boots quiet, which still prints a unit's failure, so ask PID 1 for that
# silence directly while the installer owns tty1, and hand it back after.
[Service]
Type=simple
ExecStartPre=-/usr/bin/busctl --timeout=2 call org.freedesktop.systemd1 /org/freedesktop/systemd1 org.freedesktop.systemd1.Manager SetShowStatus s no
ExecStopPost=-/usr/bin/busctl --timeout=2 call org.freedesktop.systemd1 /org/freedesktop/systemd1 org.freedesktop.systemd1.Manager SetShowStatus s ""
