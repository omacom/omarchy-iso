# tty1 shows the Omarchy boot logo until the installer's greeter draws over it
# in place (/usr/share/omarchy-iso/console-logo.sh). agetty would print the
# issue file ("Omarchy 7.2.8-9-omarchy (tty1)") and "archiso login: root
# (automatic login)" under it: --noissue drops the first, --skip-login the
# second, and the autologin is otherwise releng's (autologin.conf, which this
# replaces because it sorts after it).
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --noissue --skip-login --autologin root - $TERM
