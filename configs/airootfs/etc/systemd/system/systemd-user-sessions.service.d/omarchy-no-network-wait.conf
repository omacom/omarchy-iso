# systemd-user-sessions orders itself after network.target so that users
# who arrive over the network, or whose accounts do, find it up; getty on
# tty1 waits for it. The live installer's only login is root's autologin on
# the console, and with Plymouth and systemd-homed gone, systemd-networkd's
# start (105 ms in QEMU) was the longest thing left between udevd and the
# login. An empty assignment resets the list; the local orderings stay.
[Unit]
After=
After=remote-fs.target nss-user-lookup.target home.mount
