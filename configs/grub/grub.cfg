# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
insmod font
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
    if [ "${grub_cpu}" == 'x86_64' ]; then
        archiso_platform="x64 ${archiso_platform}"
    elif [ "${grub_cpu}" == 'i386' ]; then
        archiso_platform="IA32 ${archiso_platform}"
    else
        archiso_platform="${grub_cpu} ${archiso_platform}"
    fi
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu} ${grub_platform}"
fi

# Set default menu entry
default=archlinux
timeout=0
timeout_style=hidden

# aarch64 shows the menu; x86_64 keeps booting silently.
#
# ARM64 UEFI boxes are not interchangeable the way PCs are. Some need a device
# tree (see the Snapdragon entry below) and some must not be given one, and
# there is no way to tell from inside GRUB that is worth trusting when a black
# screen is the failure mode. A visible menu is what lets a person pick.
#
# It is also the only diagnostic this ISO has on a laptop that comes up
# headless. With timeout=0 and a hidden menu, "firmware never loaded
# BOOTAA64.EFI" and "the kernel died before it had a console" are the same black
# screen. A menu that renders proves GRUB ran, which splits the two.
#
# Gated on the DTB directory, which builder/build-iso.sh only stages on aarch64,
# so this needs no grub_cpu test and is inert on x86_64.
if [ -d /boot/grub/dtbs ]; then
    timeout=10
    timeout_style=menu
fi


# Menu entries

menuentry "Omarchy (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash xe.enable_panel_replay=0 initramfs_async=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
}

menuentry "Omarchy with speakup screen reader (%ARCH%, ${archiso_platform})" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on xe.enable_panel_replay=0 initramfs_async=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
}

# Snapdragon X (Qualcomm x1e80100) laptops.
#
# Four things this platform needs that no other supported aarch64 target does:
#
#   devicetree         Qualcomm's UEFI publishes ACPI only, and Linux has no
#                      ACPI support for x1e80100. Without an FDT in the EFI
#                      configuration table the kernel dies before it reaches a
#                      console. Loading it from the default entry would break
#                      every target that works today -- QEMU virt, Graviton and
#                      Ampere all boot from their own DT or from ACPI, and this
#                      DT describes hardware they do not have. Hence a separate
#                      entry rather than a change to the default one.
#
#   clk_ignore_unused  The x1e80100 clock and power-domain drivers gate anything
#   pd_ignore_unused   with no bound consumer. Display, USB and PCIe bind late,
#                      so the kernel powers off the panel and the links it is
#                      about to need.
#
#   efi=noruntime      Qualcomm's UEFI runtime services hang the kernel. Note
#                      this also takes efivars away for the rest of the session,
#                      which the installer's efibootmgr call cannot survive.
#
#   cma=128M           linux-aarch64 reserves 64M (CONFIG_CMA_SIZE_MBYTES=64);
#                      Adreno and MDSS want more.
#
#   rd.udev.event_timeout=5
#                      Limit a stuck initramfs udev event itself. This is not
#                      the same as `udevadm settle --timeout=5`: settle only
#                      stops waiting for the queue, while udevd otherwise lets
#                      one worker block for its 180-second default.
#
# console=tty0 puts kernel messages on the panel, and quiet/splash are dropped:
# there is no serial port on these laptops, so an unreadable failure here is
# just another black screen. Plymouth on a display stack that has not been
# proven to come up is the last thing this entry should be doing.
#
# The kernel and initramfs use the same tokens as the entries above so that
# builder/build-iso.sh's single aarch64 rewrite catches all three. The -f guard
# means this entry only appears on an ISO that actually carries the blob.
if [ -f /boot/grub/dtbs/qcom/x1e80100-lenovo-yoga-slim7x.dtb ]; then
    menuentry "Omarchy for Snapdragon X (Lenovo Yoga Slim 7x)" --hotkey x --class arch --class gnu-linux --class gnu --class os --id 'snapdragon-yoga-slim7x' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% initramfs_async=0 rd.udev.event_timeout=5 clk_ignore_unused pd_ignore_unused cma=128M efi=noruntime console=tty0
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
        devicetree /boot/grub/dtbs/qcom/x1e80100-lenovo-yoga-slim7x.dtb
    }

    # Pre-select it when SMBIOS says this is that machine, so an unattended boot
    # lands on the right entry with nobody at the keyboard.
    #
    # Advisory only: this moves the highlight, it never loads a DTB. Firmware
    # with no SMBIOS3 table, or a Lenovo model-string change, just leaves the
    # generic default selected and the menu still visible.
    #
    # smbios is not in mkarchiso's grubmodules preload list, but
    # grub-mkstandalone packs the whole arm64-efi module directory into the
    # image's memdisk, so insmod resolves it from there. SMBIOS type 1 offset 5
    # is Product Name; this laptop reports "83ED".
    if insmod smbios; then
        if smbios --type 1 --get-string 5 --set omarchy_dmi_product; then
            if [ "${omarchy_dmi_product}" = "83ED" ]; then
                default=snapdragon-yoga-slim7x
            fi
        fi
    fi
fi


if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == "i386" -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}

