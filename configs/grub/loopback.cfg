# https://www.supergrubdisk.org/wiki/Loopback.cfg

# Search for the ISO volume
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

# The menu drawn as on a stick, when the GRUB booting this file draws graphics
source /boot/grub/theme.cfg

# Set default menu entry
default=archlinux
timeout=0
timeout_style=hidden

%X86_ONLY_BEGIN%
# The live kernel: linux-t2 only where the firmware names Apple Inc. as the
# system's maker, and only on x86_64, as in grub.cfg.
set live_kernel=%KERNEL%
if [ -f '/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2' ]; then
    unset sys_vendor
    if insmod smbios; then
        if smbios --type 1 --get-string 4 --set sys_vendor; then
            if [ "${sys_vendor}" == 'Apple Inc.' ]; then
                set live_kernel=linux-t2
            fi
        fi
    fi
fi

# Ventoy finds the initramfs to add its hook to by reading this file as text,
# and it skips an initrd path with a variable in it. Without the hook the live
# system can't find the ISO on the stick, so each initramfs is named in full.
function live_initrd {
    if [ "${live_kernel}" == 'linux-t2' ]; then
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
    else
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-%KERNEL%.img
    fi
}
%X86_ONLY_END%

%ORION_ONLY_BEGIN%
set orion_kernel_options=
set orion_serial_debug=false
# The same exact SMBIOS product-name gate as grub.cfg, including Ventoy boots.
if [ "${grub_cpu}" == 'arm64' ]; then
    unset sys_product
    if insmod smbios; then
        if smbios --type 1 --get-string 5 --set sys_product; then
            if [ "${sys_product}" == 'Radxa Orion O6' -o "${sys_product}" == 'Radxa Orion O6N' ]; then
                set orion_kernel_options="clk_ignore_unused cma=512M fbcon=nodefer earlymodules=pwm_bl,linlon_dp,trilin_dpsub"
                set orion_serial_debug=true
            fi
        fi
    fi
fi
%ORION_ONLY_END%


# Menu entries

menuentry "Install" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-%LIVE_KERNEL% archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" copytoram=n initramfs_options=size=90% %BOOT_SPLASH_KERNEL_OPTIONS%%KERNEL_OPTIONS% ${orion_kernel_options}
    %LIVE_INITRD%
}

%N1X_ONLY_BEGIN%
menuentry "N1x recovery shell (hardware probe, no installer)" --class arch --class gnu-linux --class gnu --class os --id 'n1x-recovery' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-%LIVE_KERNEL% archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" copytoram=n initramfs_options=size=90% omarchy.n1x_recovery=1 acpi=nospcr disablehooks=plymouth plymouth.enable=0 nomodeset module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau nvidia_drm.modeset=0 systemd.unit=multi-user.target console=tty0 fbcon=map:0 earlycon loglevel=7 ignore_loglevel systemd.show_status=1 systemd.log_target=console udev.log_level=debug vt.global_cursor_default=1
    %LIVE_INITRD%
}
%N1X_ONLY_END%

%ORION_ONLY_BEGIN%
# Same Orion O6 / O6N serial console as grub.cfg. Loopback adds the ISO loop device.
if [ "${orion_serial_debug}" == true ]; then
    menuentry "Radxa Orion O6 / O6N serial debug (ttyAMA0, no splash)" --class arch --class gnu-linux --class gnu --class os --id 'orion-serial-debug' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-%LIVE_KERNEL% archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" copytoram=n initramfs_options=size=90% %KERNEL_OPTIONS% ${orion_kernel_options} console=tty0 console=ttyAMA0,115200n8 earlycon=pl011,0x040d0000 loglevel=7 ignore_loglevel disablehooks=plymouth plymouth.enable=0
        %LIVE_INITRD%
    }
fi
%ORION_ONLY_END%
