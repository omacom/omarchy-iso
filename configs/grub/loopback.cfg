# https://www.supergrubdisk.org/wiki/Loopback.cfg

# Search for the ISO volume
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

# The menu drawn as on a stick, when the GRUB booting this file draws graphics
source /boot/grub/theme.cfg

# Set default menu entry
default=archlinux
timeout=0
timeout_style=hidden

# The live kernel: linux-t2 only where the firmware names Apple Inc. as the
# system's maker, as in grub.cfg.
set live_kernel=%KERNEL%
if [ -f '/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2' ]; then
    unset sys_vendor
    if insmod smbios; then
        if smbios --type 1 --get-string 4 --set sys_vendor; then
            if [ "${sys_vendor}" == 'Apple Inc.' ]; then
                set live_kernel=linux-t2
            fi
        fi
    fi
fi


# Menu entries

menuentry "Install Omarchy" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" copytoram=n initramfs_options=size=90% %BOOT_SPLASH_KERNEL_OPTIONS%%KERNEL_OPTIONS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
}
# Try Omarchy from an ISO file: archiso_loop_mnt mounts it where the Try hook
# looks for the root image (grub.cfg has the same entry for a stick).
if [ -f '/%INSTALL_DIR%/%ARCH%/omarchy-try.sfs' ]; then
    menuentry "Try Omarchy" --class arch --class gnu-linux --class gnu --class os --id 'try' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" copytoram=n initramfs_options=size=90% omarchy.try=1 systemd.gpt_auto=0 %BOOT_SPLASH_KERNEL_OPTIONS%%KERNEL_OPTIONS%
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
    }
fi

%N1X_ONLY_BEGIN%
menuentry "N1x recovery shell (hardware probe, no installer)" --class arch --class gnu-linux --class gnu --class os --id 'n1x-recovery' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${live_kernel} archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" copytoram=n initramfs_options=size=90% omarchy.n1x_recovery=1 acpi=nospcr disablehooks=plymouth plymouth.enable=0 nomodeset module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau nvidia_drm.modeset=0 systemd.unit=multi-user.target console=tty0 fbcon=map:0 earlycon loglevel=7 ignore_loglevel systemd.show_status=1 systemd.log_target=console udev.log_level=debug vt.global_cursor_default=1
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${live_kernel}.img
}
%N1X_ONLY_END%
