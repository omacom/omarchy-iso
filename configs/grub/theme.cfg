# Omarchy's menu (builder/boot-menu-theme.sh): Plymouth's background and the
# logo where Plymouth centres it, so a pick leaves only the logo on screen.
# grub.cfg sources this for a stick, loopback.cfg for an ISO file another
# GRUB boots. x86_64 media carry the theme; elsewhere the menu stays hidden.
# Set only when every font loads: a signed GRUB under Secure Boot refuses
# unsigned fonts, and the menu then keeps the look it has.
omarchy_theme=/boot/grub/themes/omarchy
if [ -f "$omarchy_theme/theme.txt" ]; then
    insmod png
    for font in jetbrains-mono-regular-16 jetbrains-mono-regular-26 jetbrains-mono-bold-26; do
        if ! loadfont "$omarchy_theme/$font.pf2"; then
            omarchy_theme=
        fi
    done
    if [ -n "$omarchy_theme" ]; then
        set theme="$omarchy_theme/theme.txt"
        export theme
    fi
fi
