#
# pacman configuration for AArch64 ISO builds.
#
# Arch Linux ARM provides the base distribution and pkgs.omarchy.org the
# [omarchy] repo, which it publishes for aarch64 on the edge channel only. The
# [platform] repo is the package bundle mounted at /packages (see
# --package-dir): what the board needs that no repository carries, indexed by
# repo-add at build time.

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Order is precedence: pacman takes the first repository that carries a package
# name. The bundle pins the platform kernel and anything held at a version
# proven on the hardware; [omarchy] carries builds that must win over Arch
# Linux ARM's (Hyprland against the current aquamarine).
[platform]
SigLevel = Optional TrustAll
Server = file:///packages

[omarchy]
SigLevel = Optional TrustAll
Server = https://pkgs.omarchy.org/edge/$arch

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[aur]
Server = http://mirror.archlinuxarm.org/$arch/$repo
