#
# pacman configuration for AArch64 ISO builds.
#
# Arch Linux ARM provides the base distribution. pkgs.omarchy.org publishes no
# aarch64 repository yet, so the [omarchy] repo is the prebuilt package bundle
# mounted at /packages (see --package-dir), indexed by repo-add at build time.

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# The bundle comes first: pacman takes the first repository that carries a
# package name, and the bundle pins builds (hyprland against the current
# aquamarine, the platform kernel) that must win over Arch Linux ARM's copies.
[omarchy]
SigLevel = Optional TrustAll
Server = file:///packages

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[aur]
Server = http://mirror.archlinuxarm.org/$arch/$repo
