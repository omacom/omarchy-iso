SERIAL 0 115200
UI vesamenu.c32
MENU BACKGROUND splash.png

# The BIOS menu looks like the UEFI one (configs/grub/themes/omarchy): the
# logo on Tokyo Night's background (builder/boot-menu-theme.sh draws
# splash.png at 640x480) and the entries centred below it.
# An entry gets WIDTH - 2 * MARGIN - 4 columns: 22, room for the PXE menu's
# "Install Omarchy (NBD)". TABMSGROW, CMDLINEROW and HELPMSGROW count from
# VSHIFT, so the command line (Tab) lands on row 24 of 30, under the
# entries, as before; HELPMSGENDROW is absolute.
MENU WIDTH 80
MENU MARGIN 27
MENU ROWS 2
MENU VSHIFT 17
MENU TABMSGROW 7
MENU CMDLINEROW 7
MENU HELPMSGROW 8
MENU HELPMSGENDROW 29

# Refer to https://wiki.syslinux.org/wiki/index.php/Comboot/menu.c32

MENU COLOR screen       37;40   #00000000 #00000000 none
MENU COLOR border       30;44   #00000000 #00000000 none
MENU COLOR title        1;36;44 #00000000 #00000000 none
MENU COLOR sel          7;37;40 #ffc0caf5 #ff292e42 none
MENU COLOR hotsel       1;7;37;40 #ffc0caf5 #ff292e42 none
MENU COLOR unsel        37;44   #ffa9b1d6 #00000000 none
MENU COLOR hotkey       1;37;44 #ffa9b1d6 #00000000 none
MENU COLOR help         37;40   #00000000 #00000000 none
MENU COLOR timeout_msg  37;40   #00000000 #00000000 none
MENU COLOR timeout      1;37;40 #00000000 #00000000 none
MENU COLOR msg07        37;40   #ffa9b1d6 #00000000 none
MENU COLOR tabmsg       31;40   #00000000 #00000000 none
MENU COLOR cmdline      37;40   #ffc0caf5 #ff1a1b26 none

MENU CLEAR
MENU IMMEDIATE
