LABEL arch64
TEXT HELP
Boot the Omarchy install medium on BIOS.
It allows you to install Omarchy or perform system maintenance.
ENDTEXT
MENU LABEL Omarchy install medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% quiet xe.enable_panel_replay=0 initramfs_async=0 usb-storage.delay_use=0 loglevel=3 systemd.show_status=false

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the Omarchy install medium on BIOS with speakup screen reader.
It allows you to install Omarchy or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Omarchy install medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% accessibility=on xe.enable_panel_replay=0 initramfs_async=0 usb-storage.delay_use=0 loglevel=3 systemd.show_status=false
