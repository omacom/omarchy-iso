LABEL arch64
MENU LABEL Install
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% quiet loglevel=3 systemd.show_status=false rd.udev.log_level=3 vt.global_cursor_default=0 disablehooks=plymouth plymouth.enable=0 xe.enable_panel_replay=0 initramfs_async=0 intel_idle.states_off=0x3fc

# Just try: the root image, read from the medium as it is used, with the
# Try layer over it (hooks/omarchy_try).
LABEL arch64try
MENU LABEL ^Just try
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% omarchy.try=1 systemd.gpt_auto=0 quiet splash plymouth.use-simpledrm xe.enable_panel_replay=0 initramfs_async=0 intel_idle.states_off=0x3fc
