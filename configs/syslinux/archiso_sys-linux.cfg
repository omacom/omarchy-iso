LABEL arch64
TEXT HELP
Boot the Omarchy install medium on BIOS.
It allows you to install Omarchy or perform system maintenance.
ENDTEXT
MENU LABEL Omarchy install medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% quiet splash xe.enable_panel_replay=0 initramfs_async=0

# Try Omarchy: the root image, read from the medium as it is used, with the
# Try layer over it (hooks/omarchy_try).
LABEL arch64try
TEXT HELP
Try Omarchy from the medium without installing it.
Nothing on the machine's disks is changed. Reboot and pick Install to install.
ENDTEXT
MENU LABEL ^Try Omarchy (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% omarchy.try=1 systemd.gpt_auto=0 quiet splash xe.enable_panel_replay=0 initramfs_async=0

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the Omarchy install medium on BIOS with speakup screen reader.
It allows you to install Omarchy or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Omarchy install medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% accessibility=on xe.enable_panel_replay=0 initramfs_async=0
