LABEL arch64
TEXT HELP
Boot the Omarchy install medium on BIOS.
It allows you to install Omarchy or perform system maintenance.
ENDTEXT
MENU LABEL Omarchy install medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-t2
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-t2.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash xe.enable_panel_replay=0 initramfs_async=0

# Safe graphics boot option
LABEL arch64safe
TEXT HELP
Boot the Omarchy install medium on BIOS without kernel mode setting.
Use this when the normal boot leaves the display black.
ENDTEXT
MENU LABEL Omarchy install medium (x86_64, BIOS) with safe ^graphics
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-t2
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-t2.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash xe.enable_panel_replay=0 initramfs_async=0 nomodeset

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the Omarchy install medium on BIOS with speakup screen reader.
It allows you to install Omarchy or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Omarchy install medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-t2
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-t2.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on xe.enable_panel_replay=0 initramfs_async=0
