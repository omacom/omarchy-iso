LABEL arch64
MENU LABEL Install
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% quiet splash xe.enable_panel_replay=0 initramfs_async=0

# Just try: the root image, read from the medium as it is used, with the
# Try layer over it (hooks/omarchy_try).
LABEL arch64try
MENU LABEL ^Just try
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% omarchy.try=1 systemd.gpt_auto=0 quiet splash xe.enable_panel_replay=0 initramfs_async=0

# The installer with speakup reading it out (livecd-talk.service). quiet,
# without a splash: speakup would read the kernel's messages otherwise.
LABEL arch64speech
MENU LABEL ^Screen reader
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% quiet accessibility=on xe.enable_panel_replay=0 initramfs_async=0
