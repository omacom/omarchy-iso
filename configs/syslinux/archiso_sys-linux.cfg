LABEL arch64
TEXT HELP
Boot the Omarchy live desktop (Hyprland + Quickshell) on the stock linux kernel so you can try Omarchy before installing.
ENDTEXT
MENU LABEL Omarchy - Try the desktop (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash xe.enable_panel_replay=0 initramfs_async=0 omarchy.live

LABEL arch64-install
TEXT HELP
Boot the Omarchy TTY installer wizard on the linux-t2 (T2/Mac) kernel. It allows you to install Omarchy or perform system maintenance.
ENDTEXT
MENU LABEL Omarchy - Install (TTY wizard) (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-t2
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-t2.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash xe.enable_panel_replay=0 initramfs_async=0 omarchy.install

LABEL arch64-t2
TEXT HELP
Boot the Omarchy live desktop on the linux-t2 kernel (T2/Mac keyboards and trackpads).
ENDTEXT
MENU LABEL Omarchy - Try the desktop (linux-t2, Mac) (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-t2
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-t2.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash xe.enable_panel_replay=0 initramfs_async=0 omarchy.live

LABEL arch64-nomodeset
TEXT HELP
Boot the Omarchy live desktop with the kernel nomodeset option (disables kernel modesetting, useful on stubborn GPUs).
ENDTEXT
MENU LABEL Omarchy - Try the desktop (nomodeset) (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash xe.enable_panel_replay=0 initramfs_async=0 nomodeset omarchy.live

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the Omarchy install medium on BIOS with speakup screen reader.
It allows you to install Omarchy or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Omarchy install medium (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-t2
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-t2.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on xe.enable_panel_replay=0 initramfs_async=0 omarchy.install
