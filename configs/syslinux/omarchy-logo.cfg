# The install medium's BIOS boot, with the boot logo on the screen from here
# on. Its menu entry (archiso_sys-linux.cfg) comes here. ISOLINUX loads the
# logo's font and puts the logo where the initramfs will draw it on the VGA
# text console (omarchy-logo.psf and .txt, bin/omarchy-isolinux-logo), then
# loads the kernel and initramfs under it: on a USB 2 stick the screen was
# black for those seconds. vga=0x0f04 is "keep the current mode" to the
# kernel's setup code, which sets the 80x25 mode again otherwise, and that
# resets the VGA font: the logo's cells showed as box drawing until the
# initramfs loaded its font again. The kernel's VGA console keeps the screen
# as it finds it, but for its cursor, which it shows below the logo until the
# initramfs draws: vt.global_cursor_default=0, and the initramfs gives the
# consoles opened later their cursor back (console-logo.sh).
FONT omarchy-logo.psf
DISPLAY omarchy-logo.txt
PROMPT 0
TIMEOUT 0
DEFAULT arch64

LABEL arch64
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-omarchy
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-omarchy.img
APPEND vga=0x0f04 vt.global_cursor_default=0 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n initramfs_options=size=90% quiet xe.enable_panel_replay=0 initramfs_async=0 usb-storage.delay_use=0 loglevel=3 systemd.show_status=false
