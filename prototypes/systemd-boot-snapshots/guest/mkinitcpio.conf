# Minimal initramfs for the prototype guest. btrfs-overlayfs is the hook
# limine-mkinitcpio-hook ships today, reused unchanged: it puts a tmpfs
# overlay over a read-only snapshot so the snapshot boots writable.
# efivarfs is loaded here because the guest root carries no modules, and the
# guest reads systemd-boot's variables to report which entry it booted.
MODULES=(virtio_pci virtio_blk btrfs overlay efivarfs)
BINARIES=()
FILES=()
HOOKS=(base udev btrfs-overlayfs)
COMPRESSION=zstd
